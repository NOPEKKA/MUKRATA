<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ร้านหมูกระทะ — POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f7; --surface:#ffffff; --line:#ecebe7; --line2:#f3f1ee;
    --text:#1c1917; --muted:#9a938a; --ink:#1c1917;
    --green:#15a24a; --greenBg:#eaf6ee;
    --red:#dc4b34;  --redBg:#fbeae6;
    --amber:#d18700; --amberBg:#faf0d9;
    --blue:#2f6fed; --blueBg:#e9eefc;
    --accent:#e2503a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; -webkit-font-smoothing:antialiased;}
  #app{width:100%; max-width:460px; height:100vh; display:flex; flex-direction:column; overflow:hidden; position:relative; background:var(--bg);}
  button{font-family:inherit; cursor:pointer; color:inherit;}
  input{font-family:inherit;}
  .muted{color:var(--muted);}
  svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  header.top{padding:16px 20px 14px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .flame{font-size:19px;}
  .shop{font-weight:700; font-size:16px; line-height:1; letter-spacing:-.01em;}
  .subhead{font-size:12px; color:var(--muted); margin-top:4px;}
  .ghost-ico{border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:10px; padding:8px 11px; font-size:12.5px; display:flex; align-items:center; gap:6px;}

  .content{flex:1; overflow:auto; display:flex; flex-direction:column;}
  .pad{padding:4px 20px 24px;}

  nav.bottom{display:flex; padding:6px 8px 10px; gap:2px; background:var(--bg); border-top:1px solid var(--line);}
  nav.bottom button{flex:1; border:none; background:transparent; padding:9px 2px; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px; color:var(--muted); border-radius:12px;}
  nav.bottom button.active{color:var(--ink);}
  nav.bottom button.active svg{stroke-width:2;}

  .legend{padding:2px 20px 12px; display:flex; gap:14px; font-size:12px; color:var(--muted); flex-wrap:wrap;}
  .legend span{display:flex; align-items:center; gap:6px;}
  .dot{width:9px;height:9px;border-radius:999px;display:inline-block;}
  .canvas{position:relative; flex:1; margin:0 16px 16px; border-radius:20px; background:var(--surface); border:1px solid var(--line); overflow:auto; -webkit-overflow-scrolling:touch;}
  .plane{position:relative;}
  .fgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:10px; padding:12px;}
  .table.grid{position:static; width:auto; height:80px;}
  .canvas.edit .plane{background-image:radial-gradient(circle,#e8e6e2 1.2px,transparent 1.2px); background-size:24px 24px;}
  /* MAP editor */
  .map-canvas{position:relative;flex:1;margin:0 16px 12px;border-radius:20px;background:#f0ece4;border:1px solid var(--line);overflow:hidden;touch-action:none;}
  .map-canvas .map-plane{position:relative;width:100%;height:100%;}
  .map-item{position:absolute;display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;touch-action:none;font-size:13px;font-weight:600;transform-origin:center center;transition:outline .1s;}
  .map-item.sel{outline:2.5px solid var(--ink);outline-offset:3px;z-index:10;}
  .map-ctrl{position:absolute;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;z-index:20;font-size:12px;font-weight:700;}
  .maptool{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;}
  .maptool.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .map-panel{padding:8px 16px 10px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);align-items:center;}
  .table.flash{animation:flash .45s ease 2; z-index:5;}
  @keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(226,80,58,0)}50%{box-shadow:0 0 0 5px rgba(226,80,58,.75)}}
  .tsearch{display:flex; gap:8px; padding:0 20px 10px;}
  .tsearch input{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:10px 13px; font-size:14px;}
  .tsearch button{border:1px solid var(--line); background:var(--surface); border-radius:11px; padding:0 14px; color:var(--muted); display:flex; align-items:center;}
  .picksearch{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:11px 13px; font-size:14px; margin-bottom:12px;}
  body.wide #app{max-width:none;}
  body.wide .overlay{max-width:none;}
  body.wide .content .pad{max-width:1000px; margin-left:auto; margin-right:auto;}
  body.wide .content .pad.gcols{max-width:none; display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:18px; align-items:start;}
  body.wide .pad.gcols > *{margin:0 !important;}
  body.wide .pad.gcols .card, body.wide .pad.gcols .stat{padding:28px;}
  body.wide .pad.gcols .stat.big{padding:34px;}
  body.wide .pad.gcols .stat .v{font-size:28px;}
  body.wide .pad.gcols .stat.big .v{font-size:48px;}
  body.wide .pad.gcols .sec{font-size:12.5px;}
  body.wide .pad.gcols .menucard{padding:24px 26px;}
  body.wide .receipt{max-width:520px; margin-left:auto; margin-right:auto;}
  body.wide .sheet{top:50%; bottom:auto; left:50%; right:auto; transform:translate(-50%,-50%); width:min(480px,calc(100% - 48px)); border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.22);}
  .table{position:absolute; width:92px; height:80px; border-radius:16px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; user-select:none; touch-action:none; border:1px solid transparent; transition:transform .08s;}
  .table:active{transform:scale(.97);}
  .table .num{font-size:22px; font-weight:700; line-height:1.1; letter-spacing:-.02em;}
  .table .seats{font-size:11px; display:flex; align-items:center; gap:3px; opacity:.7;}
  .table .st{font-size:10px; font-weight:600;}
  .table.sel{outline:2px solid var(--ink); outline-offset:2px;}
  .table .grp{position:absolute; top:5px; right:7px; font-size:9px; font-weight:700; opacity:.6;}

  .btn{width:100%; border:none; padding:15px; border-radius:14px; font-size:15px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:disabled{opacity:.35;}
  .btn-ghost{background:var(--surface); color:var(--text); border:1px solid var(--line);}
  .btn-danger{background:var(--redBg); color:var(--red); font-weight:600; padding:13px; font-size:14px; border-radius:12px; border:none; width:100%; display:flex; align-items:center; justify-content:center; gap:7px;}
  .btn-sm{padding:10px; font-size:13.5px; border-radius:11px;}
  .link{border:none; background:transparent; color:var(--muted); display:flex; align-items:center; gap:5px; font-size:13.5px;}

  .sec{font-size:11.5px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px;}
  .card{background:var(--surface); border-radius:18px; padding:18px; border:1px solid var(--line);}
  .input{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:13px 14px; color:var(--text); font-size:15px;}
  .input::placeholder{color:#c4beb6;}
  .row{display:flex; gap:12px; align-items:center; margin-bottom:14px;}
  .row > label{font-size:13.5px; color:var(--muted); width:64px;}
  .stepper{width:38px; height:38px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center;}
  .stepper:active{background:var(--line2);}
  .qty{min-width:22px; text-align:center; font-size:16px; font-weight:600;}

  .linerow{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line2);}
  .linerow:last-child{border-bottom:none;}
  .linerow .nm{font-size:15px; font-weight:500;}
  .linerow .sb{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .linerow .ctrl{display:flex; align-items:center; gap:14px;}

  .listrow{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line2);}
  .listrow:last-child{border-bottom:none;}
  .chip{border:1px solid var(--line); border-radius:999px; padding:8px 15px; font-size:13px; background:var(--surface); color:var(--muted);}
  .chip.on{border-color:var(--ink); background:var(--ink); color:#fff;}
  .iconbtn{border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:9px; padding:7px 11px; font-size:13px; display:flex; align-items:center; gap:5px;}

  .menucard{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:11px; width:100%; text-align:left;}
  .menucard .ic{width:40px;height:40px;border-radius:12px;background:var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .menucard .t{font-size:15px;font-weight:600;}
  .menucard .d{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .menucard .arr{margin-left:auto;color:var(--muted);}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px;}
  .stat .l{font-size:12.5px; color:var(--muted); margin-bottom:8px;}
  .stat .v{font-size:22px; font-weight:700; letter-spacing:-.02em;}
  .stat.big{grid-column:span 2; padding:22px;}
  .stat.big .v{font-size:34px;}

  .bars{display:flex; align-items:flex-end; gap:9px; height:120px; padding-top:8px;}
  .bars .col{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end;}
  .bars .bar{width:100%; border-radius:6px; background:var(--line); min-height:4px;}
  .bars .bar.today{background:var(--ink);}
  .bars .lbl{font-size:11px; color:var(--muted);}

  .overlay{position:fixed; inset:0; background:var(--bg); z-index:30; display:flex; flex-direction:column; max-width:460px; margin:0 auto;}
  .scrim{position:fixed; inset:0; background:rgba(28,25,23,.4); z-index:40;}
  .sheet{position:fixed; left:0; right:0; bottom:0; max-width:460px; margin:0 auto; background:var(--surface); z-index:41; border-radius:24px 24px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); box-shadow:0 -10px 40px rgba(0,0,0,.12); max-height:84vh; overflow:auto;}
  .sheet h3{margin:0 0 16px; font-size:17px; font-weight:700; display:flex; justify-content:space-between; align-items:center;}
  .foot{border-top:1px solid var(--line); padding:16px 20px calc(16px + env(safe-area-inset-bottom)); background:var(--bg);}
  .center{flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); text-align:center; padding:24px; font-size:13.5px;}
  .pick{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:13px 15px; font-size:15px; font-weight:600; text-align:left; width:100%; margin-bottom:9px; display:flex; justify-content:space-between; align-items:center;}

  .receipt{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px; margin:20px;}
  .rc-h{text-align:center; margin-bottom:16px;}
  .rc-h .r1{font-size:17px; font-weight:700;}
  .rc-h .r2{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .rc-div{border-top:1px dashed var(--line); margin:14px 0;}
  .rc-line{display:flex; justify-content:space-between; font-size:14px; padding:4px 0;}
  .rc-line .q{color:var(--muted); font-size:12.5px; margin-left:6px;}
  .rc-total{display:flex; justify-content:space-between; align-items:baseline; margin-top:6px;}
  .rc-total .v{font-size:26px; font-weight:700; letter-spacing:-.02em;}
  .rc-thanks{text-align:center; font-size:12.5px; color:var(--muted); margin-top:16px;}
</style>
</head>

function fmtDT(iso){const d=new Date(iso);return `${d.getDate()} ${TH_MON[d.getMonth()]} ${d.getFullYear()+543} ${hhmm(iso)}`;}
function dur(a,b){const ms=(new Date(b))-(new Date(a)); const m=Math.max(0,Math.round(ms/60000)); return `${Math.floor(m/60)} ชม. ${m%60} น.`;}

/* ============ CLOUD SYNC via Firebase Realtime Database ============ */
const DB_KEY='mookratha_db_v4', SESS_KEY='mookratha_sess';
let syncTimer=null;
function saveLocal(){try{localStorage.setItem(DB_KEY,JSON.stringify(db));}catch{}}
function save(){
  saveLocal();
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushCloud,800);
}
async function pushCloud(){
  try{await cloudRef.set(db);}
  catch(e){console.warn('push failed, local only',e);}
}
async function syncDown(){
  try{
    const snap=await cloudRef.get();
    const data=snap.exists()?snap.val():null;
    if(data){db=data;saveLocal();}
  }catch(e){console.warn('sync failed, using local',e);}
}
function loadLocal(){try{return JSON.parse(localStorage.getItem(DB_KEY));}catch{return null;}}

/* ---------- FLOOR ---------- */
function planeSize(){
  const mx=db.tables.reduce((m,t)=>Math.max(m,t.x+TW),0)+20;
  const my=db.tables.reduce((m,t)=>Math.max(m,t.y+TH),0)+20;
  return {w:Math.max(mx,320),h:Math.max(my,240)};
}
function viewFloor(){
  const bar=`<div class="tsearch"><input id="tsearch" inputmode="numeric" placeholder="ค้นหาโต๊ะ… (พิมพ์เลขโต๊ะ)"><button data-act="table-search">${I.grid}</button></div>

  const col=`var(${STATUS[t.status].c})`;

function renderMapItems(items,selId){
  return items.map(it=>{
    const isSel=it.id===selId;
    const textStyle=`font-size:${Math.min(14,Math.max(9,it.w/8))}px;font-weight:600;color:#fff;text-align:center;word-break:break-all;padding:4px;text-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none;`;

    if(it.type==='rect') inner=`<div style="width:100%;height:100%;background:${it.color};border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden"><span style="${textStyle}">${esc(it.text)}</span></div>`;
    else if(it.type==='circle') inner=`<div style="width:100%;height:100%;background:${it.color};border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden"><span style="${textStyle}">${esc(it.text)}</span></div>`;
    else inner=`<div style="width:100%;height:100%;background:${it.color};border-radius:4px;display:flex;align-items:center;justify-content:center"><span style="font-size:10px;font-weight:600;color:#fff;opacity:.7">${esc(it.text)}</span></div>`;
    const ctrls=isSel?`
      <button class="map-ctrl" style="top:-12px;right:-12px;background:var(--red);color:#fff" data-act="map-del">✕</button>
      <button class="map-ctrl" style="top:-12px;left:-12px;background:var(--ink);color:#fff" data-act="map-rot" data-id="${it.id}">↻</button>
      <div data-rsz="${it.id}" style="position:absolute;bottom:-8px;right:-8px;width:18px;height:18px;background:var(--ink);border-radius:4px;cursor:se-resize;z-index:20;touch-action:none"></div>`:'';
    return `<div class="map-item${isSel?' sel':''}" data-mid="${it.id}" style="position:absolute;left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;transform:rotate(${it.rot||0}deg);opacity:${it.opacity||1};transform-origin:center center">${inner}${ctrls}</div>`;
  }).join('');
}
function attachMapEvents(){
  const canvas=document.getElementById('mapCanvas'); if(!canvas)return;
  const plane=document.getElementById('mapPlane'); if(!plane)return;
  // tap empty area to add
  const addHandler=e=>{
    if(e.target!==canvas&&e.target!==plane)return;
    const r=canvas.getBoundingClientRect();
    const item=newMapItem(mapTool,e.clientX-r.left-45,e.clientY-r.top-40);
    db.mapItems.push(item); mapSel=item.id; save(); render();
  };
  canvas.addEventListener('pointerdown',addHandler);
  // drag items
  document.querySelectorAll('[data-mid]').forEach(el=>{
    const id=el.getAttribute('data-mid'); let drag=null;
    el.addEventListener('pointerdown',e=>{
      if(e.target.getAttribute('data-act')||e.target.getAttribute('data-rsz'))return;
      e.stopPropagation(); mapSel=id; el.setPointerCapture(e.pointerId);
      const r=canvas.getBoundingClientRect(); const it=db.mapItems.find(x=>x.id===id);
      drag={ox:e.clientX-r.left-it.x,oy:e.clientY-r.top-it.y};
      render();
    });
    el.addEventListener('pointermove',e=>{
      if(!drag)return; const r=canvas.getBoundingClientRect(); const it=db.mapItems.find(x=>x.id===id);
      if(it){it.x=Math.max(0,e.clientX-r.left-drag.ox); it.y=Math.max(0,e.clientY-r.top-drag.oy);}
      el.style.left=it.x+'px'; el.style.top=it.y+'px';
    });
    el.addEventListener('pointerup',()=>{if(drag){drag=null;save();}});
  });
  // resize
  document.querySelectorAll('[data-rsz]').forEach(rsz=>{
    const id=rsz.getAttribute('data-rsz'); let rz=null;
    rsz.addEventListener('pointerdown',e=>{
      e.stopPropagation(); rsz.setPointerCapture(e.pointerId);
      const it=db.mapItems.find(x=>x.id===id); if(it)rz={sx:e.clientX,sy:e.clientY,iw:it.w,ih:it.h};
    });
    rsz.addEventListener('pointermove',e=>{
      if(!rz)return; const it=db.mapItems.find(x=>x.id===id);
      if(!it)return; it.w=Math.max(24,rz.iw+(e.clientX-rz.sx)); it.h=Math.max(14,rz.ih+(e.clientY-rz.sy));
      const el=document.querySelector(`[data-mid="${id}"]`); if(el){el.style.width=it.w+'px';el.style.height=it.h+'px';}
    });
    rsz.addEventListener('pointerup',()=>{if(rz){rz=null;save();}});
  });
  // prop inputs
  document.querySelectorAll('[data-map-prop]').forEach(inp=>{
    const prop=inp.getAttribute('data-map-prop');
    const update=()=>{const it=db.mapItems.find(x=>x.id===mapSel);if(!it)return;
      it[prop]=prop==='opacity'?inp.value/100:inp.value; save(); render();};
    inp.addEventListener('input',update);
  });
}

/* ---------- SUMMARY (+ สถิติเชิงลึก) ---------- */
function summaryData(){
  const t=today(); const paid=db.bills.filter(b=>b.status==='paid');
  const tb=paid.filter(b=>dateOf(b.closedAt)===t);
  const sales=tb.reduce((s,b)=>s+(b.total||0),0), heads=tb.reduce((s,b)=>s+(b.heads||0),0);
  const cash=tb.filter(b=>b.paymentMethod==='cash').reduce((s,b)=>s+b.total,0);
  const transfer=tb.filter(b=>b.paymentMethod==='transfer').reduce((s,b)=>s+b.total,0);
  const qr=tb.filter(b=>b.paymentMethod==='custom'||b.paymentMethod==='qr').reduce((s,b)=>s+b.total,0);
  const days=[],wd=['อา','จ','อ','พ','พฤ','ศ','ส'];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=dstr(d);
    days.push({lbl:wd[d.getDay()],val:paid.filter(b=>dateOf(b.closedAt)===ds).reduce((s,b)=>s+b.total,0),today:ds===t});}
  // เมนูขายดี (รวมทุกวัน)
  const pkgNames=new Set(db.packages.map(p=>p.name));
  const soldMap={};
  tb.forEach(b=>(b.lines||[]).forEach(l=>{if(l.kind==='pkg'||pkgNames.has(l.name))return;const s=soldMap[l.name]||{qty:0,amt:0};s.qty+=l.qty;s.amt+=l.amount;soldMap[l.name]=s;}));
  const sold=Object.entries(soldMap).map(([name,v])=>({name,qty:v.qty,amt:v.amt})).sort((a,b)=>b.qty-a.qty);
  // ช่วงเวลาพีค (รวมทุกวัน ตามชั่วโมง)
  const hourMap={};
  paid.forEach(b=>{const h=new Date(b.closedAt).getHours(); hourMap[h]=(hourMap[h]||0)+b.total;});
  const peak=Object.entries(hourMap).map(([h,v])=>({h:+h,v})).sort((a,b)=>b.v-a.v).slice(0,3);
  return {sales,heads,cash,transfer,qr,count:tb.length,days,sold,peak};
}

function dashData(){
  const paid=db.bills.filter(b=>b.status==='paid');
  const open=db.bills.filter(b=>b.status==='open');
  const t=today(); const yd=(()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d);})();
  const sumOn=ds=>paid.filter(b=>dateOf(b.closedAt)===ds).reduce((s,b)=>s+b.total,0);
  const cntOn=ds=>paid.filter(b=>dateOf(b.closedAt)===ds).length;
  const headOn=ds=>paid.filter(b=>dateOf(b.closedAt)===ds).reduce((s,b)=>s+(b.heads||0),0);
  const todaySales=sumOn(t), ydSales=sumOn(yd), todayBills=cntOn(t), todayHeads=headOn(t);
  const ym=t.slice(0,7); const mb=paid.filter(b=>dateOf(b.closedAt).slice(0,7)===ym);
  const monthSales=mb.reduce((s,b)=>s+b.total,0), monthBills=mb.length, monthHeads=mb.reduce((s,b)=>s+(b.heads||0),0);
  const tc={available:0,occupied:0,billing:0,reserved:0}; db.tables.forEach(x=>{tc[x.status]=(tc[x.status]||0)+1;});
  const totalT=db.tables.length||1;
  const occPct=Math.round((tc.occupied+tc.billing)/totalT*100);
  const seatedHeads=open.reduce((s,b)=>s+totals(b).heads,0);
  const openValue=open.reduce((s,b)=>s+totals(b).total,0);
  const resvToday=db.reservations.filter(r=>r.status==='booked'&&r.date===t).length;
  const hours=Array(24).fill(0); paid.forEach(b=>{hours[new Date(b.closedAt).getHours()]+=b.total;});
  const pkgN=new Set(db.packages.map(p=>p.name)); const menuMap={};
  paid.forEach(b=>(b.lines||[]).forEach(l=>{if(l.kind==='pkg'||pkgN.has(l.name))return;const s=menuMap[l.name]||{qty:0,amt:0};s.qty+=l.qty;s.amt+=l.amount;menuMap[l.name]=s;}));
  const menuTop=Object.entries(menuMap).map(([name,v])=>({name,qty:v.qty,amt:v.amt})).sort((a,b)=>b.qty-a.qty).slice(0,10);
  const pm={cash:0,transfer:0,custom:0}; paid.forEach(b=>{const k=b.paymentMethod==='qr'?'custom':b.paymentMethod; if(pm[k]!=null)pm[k]+=b.total;});
  const pmTotal=(pm.cash+pm.transfer+pm.custom)||1;
  const closeouts=db.closeouts.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,14);
  return {todaySales,ydSales,todayBills,todayHeads,monthSales,monthBills,monthHeads,tc,totalT,occPct,seatedHeads,openValue,resvToday,hours,menuTop,pm,pmTotal,closeouts,
    avgBill:todayBills?todaySales/todayBills:0, avgHead:todayHeads?todaySales/todayHeads:0};
}

function periodData(mode,key){
  const paid=db.bills.filter(b=>b.status==='paid');
  const match=b=>mode==='month'?dateOf(b.closedAt).slice(0,7)===key:dateOf(b.closedAt)===key;
  const bills=paid.filter(match);
  const sales=bills.reduce((s,b)=>s+b.total,0),count=bills.length,heads=bills.reduce((s,b)=>s+(b.heads||0),0);
  const pm={cash:0,transfer:0,custom:0};bills.forEach(b=>{const k=b.paymentMethod==='qr'?'custom':b.paymentMethod;if(pm[k]!=null)pm[k]+=b.total;});
  const pkgN=new Set(db.packages.map(p=>p.name));const mm={};
  bills.forEach(b=>(b.lines||[]).forEach(l=>{if(l.kind==='pkg'||pkgN.has(l.name))return;const s=mm[l.name]||{qty:0,amt:0};s.qty+=l.qty;s.amt+=l.amount;mm[l.name]=s;}));
  const menu=Object.entries(mm).map(([name,v])=>({name,qty:v.qty,amt:v.amt})).sort((a,b)=>b.qty-a.qty);
  return {sales,count,heads,pm,menu};
}
function monthLabel(ym){const p=ym.split('-');return TH_MON[+p[1]-1]+' '+(+p[0]+543);}
function dayLabel(ds){const d=new Date(ds+'T00:00:00');return d.getDate()+' '+TH_MON[d.getMonth()]+' '+(d.getFullYear()+543);}
function drawReport(title,rows){
  const H=112+rows.length*38;const cv=document.createElement('canvas');cv.width=620;cv.height=H;const g=cv.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,620,H);
  g.fillStyle='#1c1917';g.font='700 24px sans-serif';g.textAlign='left';g.fillText('🔥 '+db.settings.shopName,28,46);
  g.fillStyle='#9a938a';g.font='15px sans-serif';g.fillText(title,28,72);
  rows.forEach((r,i)=>{const y=108+i*38;g.textAlign='left';g.fillStyle='#9a938a';g.font='16px sans-serif';g.fillText(r[0],28,y);
    g.textAlign='right';g.fillStyle='#1c1917';g.font='700 18px sans-serif';g.fillText(r[1],592,y);});
  const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=title+'.png';a.click();
}
function periodPNG(mode,key){const p=periodData(mode,key);
  const rows=[['ยอดขาย',fmt(p.sales)],['จำนวนบิล',p.count+' บิล'],['จำนวนหัว',p.heads+' หัว'],['เฉลี่ยต่อบิล',fmt(p.count?Math.round(p.sales/p.count):0)],
    ['— ช่องทางจ่าย —',''],['  เงินสด',fmt(p.pm.cash)],['  โอน',fmt(p.pm.transfer)],['  '+(db.settings.customName||'ช่องพิเศษ'),fmt(p.pm.custom)]];
  if(p.menu.length){rows.push(['— เมนูที่ขาย —','']); p.menu.slice(0,15).forEach(x=>rows.push(['  '+x.name,x.qty+' · '+fmt(x.amt)]));}
  drawReport(mode==='month'?'สรุปเดือน '+monthLabel(key):'สรุป '+dayLabel(key), rows);}

      <button class="btn-danger" data-act="etable-del">${I.trash} ลบโต๊ะนี้</button></div>`}</div>`;
}

      +`<div class="muted" style="font-size:13.5px;margin-bottom:14px">สรุปยอดก่อนปิดร้าน · ${today()}</div>`

      +`<button class="btn btn-primary" style="margin-top:16px" data-act="closeday-go">${I.check} ยืนยันปิดร้าน</button>`);

  if(m.type==='qrpay'){

      +(m.img?`<img src="${m.img}" style="width:100%;max-width:280px;display:block;margin:0 auto 16px;border-radius:14px;border:1px solid var(--line)">`
        :`<div class="muted" style="text-align:center;padding:26px 0;font-size:13.5px">ยังไม่ได้ตั้งค่ารูป — เพิ่มได้ที่ ตั้งค่า</div>`)
      +`<button class="btn btn-primary" data-act="qrpay-confirm" data-m="${m.method}">${I.check} รับเงินแล้ว</button>`);

  if(m.type==='move'||m.type==='merge'){

    const row=t=>{const tap=m.type==='merge'||t.status==='available'; const sc=`var(${STATUS[t.status].c})`;
      return `<button class="pick" data-pick data-label="${esc(t.label)}" ${tap?`data-act="${m.type==='move'?'do-move':'do-merge'}" data-id="${t.id}"`:'disabled style="opacity:.45"'}>โต๊ะ ${esc(t.label)}<span style="font-size:12.5px;font-weight:600;color:${sc}">${STATUS[t.status].label}</span></button>`;};
    return sheet(sheetHead(m.type==='move'?'ย้ายไปโต๊ะ':'รวมกับโต๊ะ')

  if(m.type==='billactions'){const b=db.bills.find(x=>x.id===m.id);

  if(m.type==='cashmove'){

  if(m.type==='closeout'){const d=cashData();
    return sheet(sheetHead('นับเงินปิดร้าน')+`<div class="muted" style="font-size:13.5px;margin-bottom:12px">ระบบคำนวณว่าควรมี <b style="color:var(--text)">${fmt(d.expected)}</b></div><div style="margin-bottom:12px"><div class="muted" style="font-size:12.5px;margin-bottom:6px">นับเงินสดได้จริง</div><input class="input" data-mfield="counted" inputmode="decimal" value="${esc(m.values.counted||'')}"></div><button class="btn btn-primary" data-act="closeout-save">บันทึกปิดร้าน</button>`);}
  if(m.type==='resv'){
    const F=[['name','ชื่อผู้จอง','text'],['phone','เบอร์โทร','text'],['people','จำนวนคน','number'],['date','วันที่ (YYYY-MM-DD)','text'],['time','เวลา','text'],['note','หมายเหตุ','text']];
    return sheet(sheetHead('จองโต๊ะใหม่')+F.map(([k,l,ty])=>`<div style="margin-bottom:11px"><div class="muted" style="font-size:12.5px;margin-bottom:6px">${l}</div><input class="input" data-mfield="${k}" inputmode="${ty==='number'?'decimal':'text'}" value="${esc(m.values[k]??'')}"></div>`).join('')
      +`<div style="margin-bottom:12px"><div class="muted" style="font-size:12.5px;margin-bottom:6px">โต๊ะ (ถ้าระบุ)</div>
        <select class="input" data-mfield="tableId"><option value="">— ไม่ระบุ —</option>${db.tables.map(t=>`<option value="${t.id}" ${m.values.tableId===t.id?'selected':''}>โต๊ะ ${esc(t.label)}</option>`).join('')}</select></div>
      <button class="btn btn-primary" data-act="resv-save">บันทึกการจอง</button>`);}

    return sheet(sheetHead('รับลูกค้าเข้านั่ง')+`<div style="font-size:14.5px;margin-bottom:6px">${esc(r.name)} · ${r.people} คน</div><div class="muted" style="font-size:13px;margin-bottom:14px">เลือกโต๊ะที่จะเปิดบิล</div>`+(av.length>8?`<input class="picksearch" id="picksearch" inputmode="numeric" placeholder="ค้นหาเลขโต๊ะ…">`:'')+`<div style="max-height:52vh;overflow:auto">${av.map(t=>`<button class="pick" data-pick data-label="${esc(t.label)}" data-act="seat-go" data-rid="${r.id}" data-id="${t.id}">โต๊ะ ${esc(t.label)}<span class="muted" style="font-size:12px;font-weight:400">${STATUS[t.status].label}</span></button>`).join('')}</div>`);}
  return '';

/* ============ AFTER RENDER ============ */
function afterRender(){
  if(editorOpen)attachDrag('eplane','[data-etable]');
  if(mapOpen)attachMapEvents();
}
function attachDrag(planeId,sel){
  const plane=document.getElementById(planeId); if(!plane)return;
  const pw=plane.offsetWidth, ph=plane.offsetHeight;
  document.querySelectorAll(sel).forEach(elm=>{
    const id=elm.getAttribute('data-etable'); let drag=null;
    elm.addEventListener('pointerdown',e=>{elm.setPointerCapture(e.pointerId);const r=plane.getBoundingClientRect();const t=db.tables.find(x=>x.id===id);drag={ox:e.clientX-(r.left+t.x),oy:e.clientY-(r.top+t.y)};});
    elm.addEventListener('pointermove',e=>{if(!drag)return;const r=plane.getBoundingClientRect();const t=db.tables.find(x=>x.id===id);t.x=clamp(e.clientX-r.left-drag.ox,0,pw-TW);t.y=clamp(e.clientY-r.top-drag.oy,0,ph-TH);elm.style.left=t.x+'px';elm.style.top=t.y+'px';});
    elm.addEventListener('pointerup',()=>{if(!drag)return;save();editSel=id;drag=null;render();});
  });
}
function warpToTable(q){
  q=(q||'').trim(); if(!q)return;
  const t=db.tables.find(x=>x.label.toLowerCase()===q.toLowerCase())||db.tables.find(x=>x.label.toLowerCase().startsWith(q.toLowerCase()));
  if(!t)return;
  const elm=document.querySelector(`[data-table="${t.id}"],[data-etable="${t.id}"]`);
  if(!elm)return;
  elm.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
  elm.classList.remove('flash'); void elm.offsetWidth; elm.classList.add('flash');
  setTimeout(()=>elm.classList.remove('flash'),1000);
}
function filterPicks(q){
  q=(q||'').trim().toLowerCase();
  document.querySelectorAll('[data-pick]').forEach(el=>{el.style.display=(!q||el.getAttribute('data-label').toLowerCase().includes(q))?'':'none';});
}

/* ============ EVENTS ============ */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){const te=e.target.closest('[data-table]'); if(te&&view==='floor'&&!billId&&!receipt&&!editorOpen&&!overlay&&!modal&&!mapOpen){const t=db.tables.find(x=>x.id===te.getAttribute('data-table')); if(t)tapTable(t);} return;}
  const act=b.getAttribute('data-act'),id=b.getAttribute('data-id'),list=b.getAttribute('data-list');
  switch(act){
    case 'login-pick': pickUid=b.getAttribute('data-uid'); render(); break;
    case 'login-back': pickUid=null; render(); break;
    case 'login-go':{const p=db.staff.find(s=>s.id===pickUid);const pin=document.getElementById('pin').value;
      if(p&&pin===p.pin){session=p;localStorage.setItem(SESS_KEY,p.id);pickUid=null;view='floor';render();}
      else document.getElementById('pinerr').style.display='block'; break;}
    case 'logout': session=null; pickUid=null; localStorage.removeItem(SESS_KEY); view='floor'; overlay=null; render(); break;
    case 'nav': view=b.getAttribute('data-view'); render(); break;
    case 'map-open': mapOpen=true; mapSel=null; render(); break;
    case 'map-close': mapOpen=false; mapSel=null; render(); break;
    case 'floortab': floorTab=b.getAttribute('data-t'); mapSel=null; render(); break;
    case 'maptool': mapTool=b.getAttribute('data-tool'); render(); break;
    case 'map-del':{db.mapItems=db.mapItems.filter(x=>x.id!==mapSel);mapSel=null;save();render();break;}
    case 'map-rot':{const it=db.mapItems.find(x=>x.id===b.getAttribute('data-id'));if(it){it.rot=((it.rot||0)+15)%360;save();render();}break;}
    case 'map-clear':db.mapItems=[];mapSel=null;save();render();break;
    case 'layout': layout=b.getAttribute('data-l'); localStorage.setItem('mookratha_layout',layout); applyLayout(); render(); break;
    case 'table-search':{const el=document.getElementById('tsearch'); if(el)warpToTable(el.value); break;}
    case 'overlay': overlay=b.getAttribute('data-ov'); render(); break;
    case 'overlay-close': overlay=null; render(); break;

    case 'bill-close': closeBill(); break;
    case 'bill-exit': exitBill(); break;
    case 'exit-discard': doExit(); break;
    case 'dashrange': dashRange=b.getAttribute('data-r'); render(); break;
    case 'drill': modal={type:'drill',mode:b.getAttribute('data-mode'),key:b.getAttribute('data-k')}; render(); break;
    case 'periodpng': periodPNG(b.getAttribute('data-mode'),b.getAttribute('data-k')); break;
    case 'yearpng': yearPNG(); break;
    case 'bq':{const bl=curBill();const kind=b.getAttribute('data-kind'),bid=b.getAttribute('data-id');const bag=kind==='pkg'?bl.pkg:bl.itm;bag[bid]=Math.max(0,(bag[bid]||0)+parseInt(b.getAttribute('data-d')));if(bl.saved)billEdited=true;save();render();break;}
    case 'pay-start': payStep=true; render(); break;
    case 'pay-cancel': payStep=false; render(); break;
    case 'pay': checkout(b.getAttribute('data-m')); break;
    case 'pay-qr':{const meth=b.getAttribute('data-m'); const name=meth==='transfer'?'โอน — สแกน QR':(db.settings.customName||'ช่องพิเศษ'); const img=meth==='transfer'?db.settings.transferQR:db.settings.customImg; modal={type:'qrpay',method:meth,name,img}; render(); break;}
    case 'qrpay-confirm': modal=null; checkout(b.getAttribute('data-m')); break;
    case 'img-del':{const k=b.getAttribute('data-img'); db.settings[k]=''; save(); render(); break;}
    case 'op-move': modal={type:'move'}; render(); break;
    case 'op-merge': modal={type:'merge'}; render(); break;
    case 'op-split': modal={type:'split'}; render(); break;
    case 'do-move': doMove(id); break;
    case 'do-merge': doMerge(id); break;
    case 'do-split': doSplit(id); break;

    case 'receipt-done': receipt=null; render(); break;
    case 'receipt-png': receiptPNG(); break;
    case 'sum-png': summaryPNG(); break;
    case 'closeday': modal={type:'closeday'}; render(); break;
    case 'closeday-go': closeDay(); break;

    case 'editor-open': editorOpen=true; editSel=null; render(); break;
    case 'editor-close': editorOpen=false; editSel=null; render(); break;
    case 'etable-add':{const n=db.tables.reduce((m,t)=>Math.max(m,parseInt(t.label)||0),0)+1;const nid=uid();db.tables.push({id:nid,label:String(n),seats:4,x:20,y:20,status:'available'});editSel=nid;save();render();break;}
    case 'etable-done': editSel=null; render(); break;
    case 'etable-del': db.tables=db.tables.filter(t=>t.id!==editSel); editSel=null; save(); render(); break;
    case 'eseat':{const t=db.tables.find(x=>x.id===editSel);t.seats=Math.max(1,t.seats+parseInt(b.getAttribute('data-d')));save();render();break;}

    case 'edit-new': openListEditor(list,null); break;
    case 'edit-item': openListEditor(list,db[list].find(x=>x.id===id)); break;
    case 'edit-del': db[list]=db[list].filter(x=>x.id!==id); save(); render(); break;
    case 'modal-close': modal=null; render(); break;
    case 'modal-save': saveListItem(); break;
    case 'clear-go': setStatus(modal.id,'available'); modal=null; save(); render(); break;

    case 'resv-new': modal={type:'resv',values:{people:2,date:today(),time:'18:00'}}; render(); break;
    case 'resv-save': saveResv(); break;
    case 'resv-cancel':{const r=db.reservations.find(x=>x.id===id);r.status='cancelled';if(r.tableId&&(db.tables.find(t=>t.id===r.tableId)||{}).status==='reserved')setStatus(r.tableId,'available');save();render();break;}
    case 'resv-seat': modal={type:'seat',id}; render(); break;
    case 'seat-go': seatResv(b.getAttribute('data-rid'),id); break;

    case 'cash-move': modal={type:'cashmove',dir:b.getAttribute('data-t'),values:{}}; render(); break;
    case 'cash-save': saveCash(); break;
    case 'closeout': modal={type:'closeout',values:{}}; render(); break;
    case 'closeout-save': saveCloseout(); break;

    case 'bill-actions': modal={type:'billactions',id}; render(); break;
    case 'bill-view': billView=id; render(); break;
    case 'billview-close': billView=null; render(); break;
    case 'bill-reopen': reopenBill(id); break;
    case 'bill-void': voidBill(id); break;
  }
});
app.addEventListener('input',e=>{
  const f=e.target.getAttribute('data-field');
  if(f==='shopname'){db.settings.shopName=e.target.value;save();}
  else if(f==='promptpay'){db.settings.promptpay=e.target.value;save();}
  else if(f==='customname'){db.settings.customName=e.target.value;save();}
  else if(f==='etlabel'){const t=db.tables.find(x=>x.id===editSel);if(t){t.label=e.target.value;save();}}
  const mf=e.target.getAttribute('data-mfield'); if(mf&&modal)modal.values[mf]=e.target.value;
});
app.addEventListener('change',e=>{const mf=e.target.getAttribute('data-mfield'); if(mf&&modal)modal.values[mf]=e.target.value;
  const ik=e.target.getAttribute('data-img'); if(ik&&e.target.files&&e.target.files[0]){fileToThumb(e.target.files[0],url=>{db.settings[ik]=url;save();render();});}});
function fileToThumb(file,cb){
  const url=URL.createObjectURL(file); const im=new Image();
  im.onload=()=>{const max=680;let w=im.width,h=im.height;const sc=Math.min(1,max/Math.max(w,h));const cw=Math.round(w*sc),ch=Math.round(h*sc);
    const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;cv.getContext('2d').drawImage(im,0,0,cw,ch);URL.revokeObjectURL(url);
    try{cb(cv.toDataURL('image/jpeg',0.85));}catch{cb('');}};
  im.onerror=()=>{URL.revokeObjectURL(url);}; im.src=url;
}
app.addEventListener('keyup',e=>{if(e.target.id==='picksearch')filterPicks(e.target.value);});
app.addEventListener('keydown',e=>{if(e.target.id==='tsearch'&&e.key==='Enter')warpToTable(e.target.value);});

/* ---------- logic ---------- */
function tapTable(t){
  if(t.status==='billing'){modal={type:'clear',id:t.id,title:'โต๊ะ '+t.label};render();return;}
  if(t.status==='reserved'){const r=db.reservations.find(x=>x.status==='booked'&&x.tableId===t.id);if(r){modal={type:'seat',id:r.id};render();return;}}
  openBill(t);
}
function closeBill(){const b=curBill();const {total,heads}=totals(b);
  if(heads===0&&total===0){db.bills=db.bills.filter(x=>x.id!==b.id);b.tableIds.forEach(id=>setStatus(id,'available'));}
  else {
    if(!b.saved){b.saved=true; billLog(b,'บันทึกออเดอร์',`${heads} หัว · ${fmt(total)}`);}
    else if(billEdited){billLog(b,'แก้ไขออเดอร์',`${heads} หัว · ${fmt(total)}`);}
    b.tableIds.forEach(id=>setStatus(id,'occupied'));
  }
  billId=null;payStep=false;billEdited=false;billBackup=null;save();render();}
function exitBill(){const b=curBill();const {total}=totals(b);
  if((!b.saved&&total>0)||(b.saved&&billEdited)){modal={type:'exitconfirm'};render();return;}
  doExit();}
function doExit(){const b=curBill();
  if(!b.saved){db.bills=db.bills.filter(x=>x.id!==b.id);b.tableIds.forEach(id=>setStatus(id,'available'));}
  else {if(billBackup){b.pkg=JSON.parse(JSON.stringify(billBackup.pkg));b.itm=JSON.parse(JSON.stringify(billBackup.itm));} b.tableIds.forEach(id=>setStatus(id,'occupied'));}
  billId=null;payStep=false;billEdited=false;billBackup=null;modal=null;save();render();}
function checkout(method){const b=curBill();const {total,heads}=totals(b);
  const lines=[];db.packages.forEach(p=>{const q=b.pkg[p.id]||0;if(q)lines.push({name:p.name,qty:q,amount:q*p.price,kind:'pkg'});});
  db.menu.forEach(m=>{const q=b.itm[m.id]||0;if(q)lines.push({name:m.name,qty:q,amount:q*m.price,kind:'itm'});});
  if(!b.no)b.no=++db.counters.bill;
  b.status='paid';b.closedAt=new Date().toISOString();b.paymentMethod=method;b.total=total;b.heads=heads;b.lines=lines;b.tableLabel=labelFor(b);
  billLog(b,'คิดเงิน',`${fmt(total)} · ${payLabel(method)}`);
  b.tableIds.forEach(id=>setStatus(id,'billing')); receipt=b; billId=null; payStep=false; save(); render();}
function setStatus(tid,st){const t=db.tables.find(x=>x.id===tid);if(t)t.status=st;}

function doMove(target){const b=curBill();const old=b.tableIds.slice();old.forEach(id=>setStatus(id,'available'));b.tableIds=[target];b.tableLabel=labelFor(b);setStatus(target,'occupied');billLog(b,'ย้ายโต๊ะ',`${old.map(i=>(db.tables.find(t=>t.id===i)||{}).label).join('+')} → ${b.tableLabel}`);modal=null;save();render();}
function doMerge(target){const b=curBill();const other=db.bills.find(x=>x.status==='open'&&x.tableIds.includes(target)&&x.id!==b.id);
  if(other){db.packages.forEach(p=>{if(other.pkg[p.id])b.pkg[p.id]=(b.pkg[p.id]||0)+other.pkg[p.id];});db.menu.forEach(m=>{if(other.itm[m.id])b.itm[m.id]=(b.itm[m.id]||0)+other.itm[m.id];});other.tableIds.forEach(id=>{if(!b.tableIds.includes(id))b.tableIds.push(id);});db.bills=db.bills.filter(x=>x.id!==other.id);}
  else if(!b.tableIds.includes(target))b.tableIds.push(target);
  b.tableLabel=labelFor(b);b.tableIds.forEach(id=>setStatus(id,'occupied'));billLog(b,'รวมโต๊ะ',b.tableLabel);modal=null;save();render();}
function doSplit(id){const b=curBill();if(b.tableIds.length<=1){modal=null;render();return;}b.tableIds=b.tableIds.filter(x=>x!==id);setStatus(id,'available');b.tableLabel=labelFor(b);billLog(b,'แยกโต๊ะ',(db.tables.find(t=>t.id===id)||{}).label+' ออก');modal=null;save();render();}

function openListEditor(key,item){const blank={packages:{name:'',price:0},menu:{name:'',price:0,category:'อื่นๆ'},staff:{name:'',pin:'0000',role:'staff'}}[key];
  modal={type:'listedit',list:key,title:{packages:'แพ็กเกจ',menu:'เมนู',staff:'พนักงาน'}[key],isNew:!item,values:item?{...item}:{...blank,id:uid()}};render();}
function saveListItem(){const v={...modal.values};LIST_FIELDS[modal.list].forEach(([k,,ty])=>{if(ty==='number')v[k]=parseFloat(v[k])||0;});if(!v.name){modal=null;render();return;}const arr=db[modal.list];const i=arr.findIndex(x=>x.id===v.id);if(i>=0)arr[i]=v;else arr.push(v);modal=null;save();render();}

function saveResv(){const v=modal.values;if(!v.name){modal=null;render();return;}
  const r={id:uid(),name:v.name,phone:v.phone||'',people:parseInt(v.people)||1,date:v.date||today(),time:v.time||'',note:v.note||'',tableId:v.tableId||'',status:'booked',createdAt:new Date().toISOString()};
  db.reservations.push(r); if(r.tableId&&(db.tables.find(t=>t.id===r.tableId)||{}).status==='available')setStatus(r.tableId,'reserved');
  modal=null;save();render();}
function seatResv(rid,tid){const r=db.reservations.find(x=>x.id===rid);if(r)r.status='seated';setStatus(tid,'available');modal=null;overlay=null;view='floor';const t=db.tables.find(x=>x.id===tid);save();openBill(t);}

function saveCash(){const amt=parseFloat(modal.values.amount);if(!amt||amt<=0){modal=null;render();return;}
  db.cash.unshift({id:uid(),at:new Date().toISOString(),staffName:session.name,type:modal.dir,amount:amt,note:modal.values.note||''});
  logAct(modal.dir==='in'?'เงินเข้าลิ้นชัก':'เงินออกลิ้นชัก',fmt(amt)+(modal.values.note?' · '+modal.values.note:''));modal=null;save();render();}
function saveCloseout(){const counted=parseFloat(modal.values.counted)||0;const d=cashData();
  const t=today();db.closeouts=db.closeouts.filter(c=>c.date!==t);
  db.closeouts.push({id:uid(),date:t,staffName:session.name,counted,expected:d.expected,diff:counted-d.expected,at:new Date().toISOString()});
  logAct('ปิดร้าน/นับเงิน',`นับได้ ${fmt(counted)} · ส่วนต่าง ${fmt(counted-d.expected)}`);modal=null;save();render();}

function reopenBill(id){const b=db.bills.find(x=>x.id===id);b.status='open';b.saved=true;b.tableIds.forEach(tid=>{if((db.tables.find(t=>t.id===tid)||{}))setStatus(tid,'occupied');});billLog(b,'เปิดแก้ไขบิล','');modal=null;overlay=null;billView=null;billId=b.id;payStep=false;save();render();}
function voidBill(id){const b=db.bills.find(x=>x.id===id);b.status='void';b.tableIds.forEach(tid=>{if((db.tables.find(t=>t.id===tid)||{}).status==='billing')setStatus(tid,'available');});billLog(b,'ยกเลิกบิล',fmt(b.total));modal=null;save();render();}

function clockIn(p){if(!db.shifts.some(s=>s.staffId===p.id&&!s.outAt))db.shifts.unshift({id:uid(),staffId:p.id,staffName:p.name,inAt:new Date().toISOString(),outAt:null});save();}
function clockOut(){if(!session)return;const s=db.shifts.find(x=>x.staffId===session.id&&!x.outAt);if(s)s.outAt=new Date().toISOString();save();}

applyLayout();
// โหลดจาก localStorage ก่อน (เร็ว) แล้ว sync จาก Supabase ทีหลัง
render();
syncDown().then(()=>render()).catch(()=>{});
</script>
</body>
</html>
